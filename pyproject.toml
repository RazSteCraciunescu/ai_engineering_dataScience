[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "public-feedback-intelligence"
version = "1.0.0"
description = "Offline-first data collection, data science and AI engineering reference platform."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "jupyter>=1.1,<2", "nbclient>=0.10,<1", "nbformat>=5.10,<6", "pytest>=8.3,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]
apps = ["streamlit>=1.40,<2", "gradio>=5,<7"]
tracking = ["mlflow>=2.18,<4", "wandb>=0.19,<1", "langfuse>=3,<5"]
llm = ["transformers>=4.47,<6", "sentence-transformers>=3.3,<6", "langchain>=0.3,<2", "llama-index>=0.12,<1", "crewai>=0.90,<2", "chromadb>=0.5,<2", "qdrant-client>=1.12,<2", "mcp>=1.2,<2"]
deep-learning = ["keras>=3.7,<4", "tensorflow>=2.18,<3", "torch>=2.5,<3", "xgboost>=2.1,<4"]
generative-vision = ["diffusers>=0.32,<1", "accelerate>=1.2,<2", "safetensors>=0.4,<1"]

[project.scripts]
feedback-lab = "feedback_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["feedback_intelligence"]
omit = ["*/integrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 78

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
